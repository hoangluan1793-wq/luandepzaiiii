<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện chữ Hán HSK2 - 153 Từ (Bản Chi Tiết)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            margin: 0;
            padding: 20px;
            color: #d4d4d4;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #fff;
        }
        .stats {
            font-size: 14px;
            color: #aaa;
        }
        .card-box, .ai-section {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .hanzi-display {
            font-size: 55px;
            text-align: center;
            margin-bottom: 15px;
            color: #ff7b72;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #007acc;
            outline: none;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-check {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-check:hover { background-color: #444; }
        .btn-skip {
            background-color: #3c3836;
            color: #feb867;
            width: 100%;
            margin-top: 5px;
        }
        .btn-skip:hover { background-color: #4c4643; }
        .btn-next {
            background-color: #2ea043;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .btn-next:hover { background-color: #2c974b; }
        .ai-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #fff;
        }
        .ai-section p {
            font-size: 13px;
            color: #aaa;
        }
        .btn-ai {
            background-color: #8b3a3a;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .result-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            background-color: #1e1e1e;
            border: 1px dashed #555;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>练习 · Luyện chữ Hán HSK2</h2>
        <div class="stats" id="stats">Đã học 1/153 · Đúng 0</div>
    </div>

    <!-- Thẻ học chữ Hán -->
    <div class="card-box">
        <div class="hanzi-display" id="hanziCard">字</div>
        <div class="input-group">
            <input type="text" id="pinyinInput" placeholder="Gõ pinyin (không cần dấu thanh), ấn Enter..." onkeypress="handleKeyPress(event)">
            <button class="btn-check" onclick="checkAnswer()">Kiểm tra</button>
        </div>
        <button class="btn-skip" onclick="skipAndShowAnswer()">Bỏ qua / Xem đáp án & Phân tích chi tiết</button>
        <button class="btn-next" onclick="nextCard()">Chuyển từ tiếp theo ➔</button>
        <div class="result-message" id="resultMsg" style="display: none;"></div>
    </div>

    <!-- Phần đặt câu với AI -->
    <div class="ai-section">
        <h3>Đặt câu với từ này</h3>
        <p>Thử viết một câu tiếng Trung dùng từ vừa học, rồi nhờ AI kiểm tra giúp bạn.</p>
        <div class="input-group" style="margin-bottom: 10px;">
            <input type="text" id="apiKeyInput" placeholder="Dán Gemini API key của bạn vào đây (chỉ lưu tạm trên trình duyệt)...">
        </div>
        <div class="input-group">
            <input type="text" id="userSentence" placeholder="Viết câu của bạn bằng chữ Hán ở đây...">
        </div>
        <button class="btn-ai" onclick="checkSentenceWithAI()">Nhờ AI sửa câu</button>
        <div class="result-message" id="aiResultMsg" style="display: none;"></div>
    </div>
</div>

<script>
    // 153 từ HSK2 kèm phân tích cấu tạo chi tiết, bộ thủ và mẹo nhớ dễ hiểu
    const originalList = [
        { hanzi: "吧", pinyinNoTone: "ba", pinyinTone: "ba", meaning: "nhỉ, nhé (trợ từ)", detail: "• Cấu tạo: Gồm 口 (Bộ khẩu - miệng) + 巴 (chữ ba phát âm).<br>• Mẹo nhớ: Dùng cái <b>miệng (口)</b> nói câu đề nghị với âm <b>ba (巴)</b> ở cuối câu." },
        { hanzi: "白", pinyinNoTone: "bai", pinyinTone: "bái", meaning: "trắng", detail: "• Cấu tạo: Biến thể từ mặt trời 日 có thêm một tia sáng.<br>• Mẹo nhớ: Ánh sáng ban ngày chói chang làm mọi vật trở nên <b>trắng (白)</b> sáng." },
        { hanzi: "百", pinyinNoTone: "bai", pinyinTone: "bǎi", meaning: "trăm", detail: "• Cấu tạo: Gồm 一 (số một) nằm trên 白 (màu trắng).<br>• Mẹo nhớ: Một trăm điểm trắng tinh hoàn hảo." },
        { hanzi: "帮助", pinyinNoTone: "bangzhu", pinyinTone: "bāngzhù", meaning: "giúp đỡ", detail: "• Cấu tạo: 帮 (bên trái là bộ khăn 巾, bên phải là cày ruộng) + 助 (chữ Đán + lực 力).<br>• Mẹo nhớ: Dùng <b>sức lực (力)</b> để <b>giúp đỡ (帮助)</b> người khác vượt qua khó khăn." },
        { hanzi: "报纸", pinyinNoTone: "baozhi", pinyinTone: "bàozhǐ", meaning: "báo chí", detail: "• Cấu tạo: 报 (Bộ thủ 扌- tay báo tin) + 纸 (Bộ sợi tơ 纟 kết hợp chỉ giấy).<br>• Mẹo nhớ: Dùng tay cầm tờ <b>giấy (纸)</b> đưa tin tức <b>báo chí (报纸)</b>." },
        { hanzi: "比", pinyinNoTone: "bi", pinyinTone: "bǐ", meaning: "so với", detail: "• Cấu tạo: Gồm hai người cùng quay mặt về một hướng.<br>• Mẹo nhớ: Hai người đứng song song để <b>so sánh (比)</b> chiều cao." },
        { hanzi: "别", pinyinNoTone: "bie", pinyinTone: "bié", meaning: "đừng, khác", detail: "• Cấu tạo: Gồm 口 (miệng) + 刂 (con dao).<br>• Mẹo nhớ: Dùng <b>dao (刂)</b> cắt ngang để chia cắt, phân biệt cái <b>khác (别)</b> hoặc ra lệnh <b>đừng (别)</b> làm." },
        { hanzi: "宾馆", pinyinNoTone: "binguan", pinyinTone: "bīnguǎn", meaning: "khách sạn", detail: "• Cấu tạo: 宾 (Mái nhà 宀 đón khách quý) + 馆 (Nhà ăn lớn 饣).<br>• Mẹo nhớ: Tòa nhà lớn có chỗ ngủ nghỉ cho khách du lịch gọi là <b>khách sạn (宾馆)</b>." },
        { hanzi: "长", pinyinNoTone: "chang", pinyinTone: "cháng", meaning: "dài", detail: "• Cấu tạo: Tượng hình mái tóc dài của một người già hoặc con đường kéo dài.<br>• Mẹo nhớ: Nét kéo dài tượng trưng cho độ <b>dài (长)</b>." },
        { hanzi: "唱歌", pinyinNoTone: "changge", pinyinTone: "chànggē", meaning: "ca hát", detail: "• Cấu tạo: 唱 (Bộ khẩu 口 - há miệng) + 歌 (Bộ khiếm 欠 - phát ra tiếng).<br>• Mẹo nhớ: Dùng cái <b>miệng (口)</b> để <b>hát ca (唱歌)</b>." },
        { hanzi: "出", pinyinNoTone: "chu", pinyinTone: "chū", meaning: "ra", detail: "• Cấu tạo: Chân bước từ trong hang sâu đi ra ngoài.<br>• Mẹo nhớ: Từ trong nhà bước <b>ra (出)</b> ngoài sân." },
        { hanzi: "穿", pinyinNoTone: "chuan", pinyinTone: "chuān", meaning: "mặc", detail: "• Cấu tạo: 穴 (cái hang) + 牙 (nha/xuyên qua).<br>• Mẹo nhớ: Xuyên qua hang động, hay là xỏ chân tay xuyên qua quần áo để <b>mặc (穿)</b>." },
        { hanzi: "次", pinyinNoTone: "ci", pinyinTone: "cì", meaning: "lần", detail: "• Cấu tạo: 冫 (băng giá) + 欠 (há miệng thở).<br>• Mẹo nhớ: Lạnh thấu xương phải thở ra từng <b>lần (次)</b> một." },
        { hanzi: "从", pinyinNoTone: "cong", pinyinTone: "cóng", meaning: "từ", detail: "• Cấu tạo: Hai người (人) đi nối đuôi nhau.<br>• Mẹo nhớ: Người đi sau đi theo người đi trước xuất phát <b>từ (从)</b> một điểm." },
        { hanzi: "错", pinyinNoTone: "cuo", pinyinTone: "cuò", meaning: "sai", detail: "• Cấu tạo: 钅 (kim loại) + các bộ phận bên phải chỉ sự lệch lạc.<br>• Mẹo nhớ: Đồ kim loại đúc bị lỗi, bị <b>sai (错)</b> hỏng." },
        { hanzi: "打篮球", pinyinNoTone: "dalanqiu", pinyinTone: "dǎ lánqiú", meaning: "đánh bóng rổ", detail: "• Cấu tạo: 打 (Tay 扌 đánh) + 篮 (Tre rổ ⺮) + 球 (Vua đá bóng 王).<br>• Mẹo nhớ: Dùng tay đánh quả bóng tròn vào rổ tre là chơi <b>bóng rổ (打篮球)</b>." },
        { hanzi: "大家", pinyinNoTone: "dajia", pinyinTone: "dàjiā", meaning: "mọi người", detail: "• Cấu tạo: 大 (lớn) + 家 (Mái nhà 宀 có nhiều người trong gia đình).<br>• Mẹo nhớ: Cả một gia đình lớn tập hợp <b>mọi người (大家)</b> lại." },
        { hanzi: "但是", pinyinNoTone: "danshi", pinyinTone: "dànshì", meaning: "nhưng mà", detail: "• Cấu tạo: 但 (Nhân đứng 亻) + 是 (Nhật 日 chính là).<br>• Mẹo nhớ: Ý nghĩa chuyển ý, tuy vậy <b>nhưng mà (但是)</b> vẫn thế." },
        { hanzi: "到", pinyinNoTone: "dao", pinyinTone: "dào", meaning: "đến", detail: "• Cấu tạo: 刂 (con dao) + 至 (đích đến)." },
        { hanzi: "得", pinyinNoTone: "de", pinyinTone: "de", meaning: "trợ từ kết cấu", detail: "• Cấu tạo: 彳 (bước chân) kết hợp chữ đắc đạt được." },
        { hanzi: "等", pinyinNoTone: "deng", pinyinTone: "děng", meaning: "đợi, chờ", detail: "• Cấu tạo: ⺮ (tre) + 寸 (đơn vị tấc).<br>• Mẹo nhớ: Cầm thước tre đứng <b>đợi (等)</b> người." },
        { hanzi: "弟弟", pinyinNoTone: "didi", pinyinTone: "dìdi", meaning: "em trai", detail: "• Cấu tạo: 弓 (cây cung) uốn lượn.<br>• Mẹo nhớ: Cậu em trai nghịch ngợm như cây cung." },
        { hanzi: "第一", pinyinNoTone: "diyiyi", pinyinTone: "dì yī", meaning: "thứ nhất", detail: "• Cấu tạo: 第 (Thứ tự tre ⺮) + 一 (Số một).<br>• Mẹo nhớ: Vị trí <b>thứ nhất (第一)</b>." },
        { hanzi: "懂", pinyinNoTone: "dong", pinyinTone: "dǒng", meaning: "hiểu", detail: "• Cấu tạo: 忄 (tấm lòng/trí tuệ) + chữ đổng.<br>• Mẹo nhớ: Dùng cái đầu và <b>tấm lòng (忄)</b> để thông suốt, thấu <b>hiểu (懂)</b> vấn đề." },
        { hanzi: "对", pinyinNoTone: "dui", pinyinTone: "duì", meaning: "đối với, đúng", detail: "• Cấu tạo: 𠂉 kết hợp 寸.<br>• Mẹo nhớ: Hướng về phía đối phương là <b>đối với (对)</b>, làm chuẩn chỉnh là <b>đúng</b>." },
        { hanzi: "房间", pinyinNoTone: "fangjian", pinyinTone: "fángjiān", meaning: "phòng", detail: "• Cấu tạo: 房 (Hộ 户 - cửa phòng) + 间 (Môn 门 - khung cửa lớn).<br>• Mẹo nhớ: Ngôi nhà chia thành nhiều khoảng không gian <b>phòng (房间)</b>." },
        { hanzi: "非常", pinyinNoTone: "feichang", pinyinTone: "fēicháng", meaning: "vô cùng", detail: "• Cấu tạo: 非 (không bình thường) + 常 (thường xuyên).<br>• Mẹo nhớ: Vượt mức bình thường là <b>vô cùng, cực kỳ (非常)</b>." },
        { hanzi: "服务员", pinyinNoTone: "fuwuyuan", pinyinTone: "fúwùyuán", meaning: "nhân viên phục vụ", detail: "• Cấu tạo: 服 (Áo) + 务 (Lực 力) + 员 (Nhân viên).<br>• Mẹo nhớ: Người dùng sức lao động <b>phục vụ (服务员)</b> khách hàng." },
        { hanzi: "高", pinyinNoTone: "gao", pinyinTone: "gāo", meaning: "cao", detail: "• Cấu tạo: Tượng hình tòa tháp/lầu gác nhiều tầng cao vút." },
        { hanzi: "告诉", pinyinNoTone: "gaosu", pinyinTone: "gàosù", meaning: "nói cho biết", detail: "• Cấu tạo: 告 (Trâu 牛 + Miệng 口) + 诉 (Ngôn 讠).<br>• Mẹo nhớ: Dùng lời nói <b>(讠)</b> để <b>thông báo, bảo (告诉)</b> cho người khác biết." },
        { hanzi: "哥哥", pinyinNoTone: "gege", pinyinTone: "gēge", meaning: "anh trai", detail: "• Cấu tạo: Chữ 可 lặp lại 2 lần.<br>• Mẹo nhớ: Người anh trai đáng tin cậy." },
        { hanzi: "给", pinyinNoTone: "gei", pinyinTone: "gěi", meaning: "cho, đưa", detail: "• Cấu tạo: 纟 (sợi tơ) + 合 (hợp lại).<br>• Mẹo nhớ: Cầm sợi tơ trao <b>cho (给)</b> người khác." },
        { hanzi: "公共汽车", pinyinNoTone: "gonggongqiche", pinyinTone: "gōnggòng qìchē", meaning: "xe buýt", detail: "• Cấu tạo: 公 (chung) + 共 (cùng) + 汽 (hơi nước) + 车 (xe).<br>• Mẹo nhớ: Xe chạy bằng động cơ dùng chung cho công cộng là <b>xe buýt (公共汽车)</b>." },
        { hanzi: "公司", pinyinNoTone: "gongsi", pinyinTone: "gōngsī", meaning: "công ty", detail: "• Cấu tạo: 公 (chung) + 司 (cơ quan quản lý).<br>• Mẹo nhớ: Nơi làm việc chung của tập thể gọi là <b>công ty (公司)</b>." },
        { hanzi: "贵", pinyinNoTone: "gui", pinyinTone: "guì", meaning: "đắt, quý", detail: "• Cấu tạo: Phía dưới có chữ 贝 (vỏ sò/tiền tài cổ).<br>• Mẹo nhớ: Tốn nhiều tiền (贝) thì là đồ <b>đắt đỏ, quý giá (贵)</b>." },
        { hanzi: "还", pinyinNoTone: "hai", pinyinTone: "hái", meaning: "còn, vẫn", detail: "• Cấu tạo: 辶 (bước đi) + 不 (không)." },
        { hanzi: "孩子", pinyinNoTone: "haizi", pinyinTone: "háizi", meaning: "trẻ em", detail: "• Cấu tạo: 孩 (Trẻ) + 子 (con cái).<br>• Mẹo nhớ: Đứa trẻ con nhỏ tuổi là <b>hài tử (孩子)</b>." },
        { hanzi: "好吃", pinyinNoTone: "haochi", pinyinTone: "hǎochī", meaning: "ngon", detail: "• Cấu tạo: 好 (Nữ + Tử - mẹ con tốt) + 吃 (Miệng ăn 口).<br>• Mẹo nhớ: Miệng ăn đồ ngon tuyệt." },
        { hanzi: "黑", pinyinNoTone: "hei", pinyinTone: "hēi", meaning: "đen", detail: "• Cấu tạo: Tượng hình khói bếp bốc lên làm nhọ nồi đen kịt." },
        { hanzi: "红", pinyinNoTone: "hong", pinyinTone: "hóng", meaning: "đỏ", detail: "• Cấu tạo: 纟 (sợi tơ) nhuộm màu <b>đỏ (红)</b> thắm." },
        { hanzi: "机场", pinyinNoTone: "jichang", pinyinTone: "jīchǎng", meaning: "sân bay", detail: "• Cấu tạo: 机 (Gỗ làm máy bay 木) + 场 (Bãi đất 土).<br>• Mẹo nhớ: Bãi đất rộng lớn cho máy bay hạ cánh là <b>sân bay (机场)</b>." },
        { hanzi: "鸡蛋", pinyinNoTone: "jidan", pinyinTone: "jīdàn", meaning: "trứng gà", detail: "• Cấu tạo: 鸡 (Con gà 鸟) + 蛋 (Lòng đỏ trứng 月).<br>• Mẹo nhớ: Quả trứng do con gà đẻ ra là <b>kê đản (鸡蛋)</b>." },
        { hanzi: "件", pinyinNoTone: "jian", pinyinTone: "jiàn", meaning: "chiếc (lượng từ)", detail: "• Cấu tạo: 亻 (người) + 人 (người). Lượng từ đếm áo quần, sự việc." },
        { hanzi: "教室", pinyinNoTone: "jiaoshi", pinyinTone: "jiàoshì", meaning: "phòng học", detail: "• Cấu tạo: 教 (Dạy học) + 室 (Phòng 宀).<br>• Mẹo nhớ: Ngôi nhà 宀 để thầy cô dạy học là <b>phòng học (教室)</b>." },
        { hanzi: "姐姐", pinyinNoTone: "jiejie", pinyinTone: "jiějie", meaning: "chị gái", detail: "• Cấu tạo: Bộ nữ 女 chỉ phái nữ trong gia đình." },
        { hanzi: "介绍", pinyinNoTone: "jieshao", pinyinTone: "jièshào", meaning: "giới thiệu", detail: "• Cấu tạo: 介 (nhân) + 绍 (tơ sợi 纟 kết nối giao lưu giữa mọi người)." },
        { hanzi: "进", pinyinNoTone: "jin", pinyinTone: "jìn", meaning: "vào", detail: "• Cấu tạo: 辶 (bước chân di chuyển tiến lên phía trước)." },
        { hanzi: "近", pinyinNoTone: "jin", pinyinTone: "jìn", meaning: "gần", detail: "• Cấu tạo: 辶 (khoảng cách cự ly gần)." },
        { hanzi: "就", pinyinNoTone: "jiu", pinyinTone: "jiù", meaning: "thì, ngay", detail: "• Cấu tạo: 京 (kinh thành) + 曰 (nói)." },

        { hanzi: "元", pinyinNoTone: "yuan", pinyinTone: "yuán", meaning: "tệ (đồng)", detail: "• Cấu tạo: Nhân 亻 + nhị 二 (đứng đầu, tiền tệ đơn vị)." },
        { hanzi: "远", pinyinNoTone: "yuan", pinyinTone: "yuǎn", meaning: "xa", detail: "• Cấu tạo: 辶 (Đường đi xa xôi cách trở)." },
        { hanzi: "运动", pinyinNoTone: "yundong", pinyinTone: "yùndòng", meaning: "vận động", detail: "• Cấu tạo: 运 (Chuyển động 辶) + 动 (Dùng sức lực 力).<br>• Mẹo nhớ: Chạy nhảy dùng sức vận động thể thao." },
        { hanzi: "再", pinyinNoTone: "zai", pinyinTone: "zài", meaning: "lại", detail: "• Cấu tạo: Lặp lại hành động lần nữa." },
        { hanzi: "早上", pinyinNoTone: "zaoshang", pinyinTone: "zǎoshang", meaning: "sáng", detail: "• Cấu tạo: 日 (mặt trời) + 十 (mặt trời vừa ló dạng ban mai)." },
        { hanzi: "张", pinyinNoTone: "zhang", pinyinTone: "zhāng", meaning: "tấm", detail: "• Cấu tạo: 弓 (cây cung) + 长 (giương cung ra để bắn)." },
        { hanzi: "丈夫", pinyinNoTone: "zhangfu", pinyinTone: "zhàngfu", meaning: "chồng", detail: "• Cấu tạo: 丈 (đàn ông trưởng thành 大) + 夫 (đại 大)." },
        { hanzi: "找", pinyinNoTone: "zhao", pinyinTone: "zhǎo", meaning: "tìm", detail: "• Cấu tạo: 扌 (dùng tay khua khoắng <b>tìm kiếm (找)</b> đồ vật)." },
        { hanzi: "着", pinyinNoTone: "zhe", pinyinTone: "zhe", meaning: "đang", detail: "• Cấu tạo: Trợ từ trạng thái tiếp diễn của hành động." },
        { hanzi: "真", pinyinNoTone: "zhen", pinyinTone: "zhēn", meaning: "thật", detail: "• Cấu tạo: 目 (mắt) + 八. Sự thực chân chính rõ ràng." },
        { hanzi: "正在", pinyinNoTone: "zhengzai", pinyinTone: "zhèngzài", meaning: "đang", detail: "• Cấu tạo: 正 (Đúng lúc 止) + 在 (tại)." },
        { hanzi: "知道", pinyinNoTone: "zhidao", pinyinTone: "zhīdào", meaning: "biết", detail: "• Cấu tạo: 知 (Miệng nói thấu triệt) + 道 (Đường đi 辶)." },
        { hanzi: "准备", pinyinNoTone: "zhunbei", pinyinTone: "zhǔnbèi", meaning: "chuẩn bị", detail: "• Cấu tạo: 准 + 备 (Sắp xếp sẵn sàng mọi thứ)." },
        { hanzi: "自行车", pinyinNoTone: "zixingche", pinyinTone: "zìxíngchē", meaning: "xe đạp", detail: "• Cấu tạo: 自 (tự) + 行 (đi) + 车 (xe). Xe tự đạp đi." },
        { hanzi: "走", pinyinNoTone: "zou", pinyinTone: "zǒu", meaning: "đi", detail: "• Cấu tạo: Tượng hình người đang vung tay sải chân <b>đi (走)</b>." },
        { hanzi: "最", pinyinNoTone: "zui", pinyinTone: "zuì", meaning: "nhất", detail: "• Cấu tạo: 曰 (nói) + 取 (chiếm lấy vị trí hàng đầu <b>nhất (最)</b>)." },
        { hanzi: "左边", pinyinNoTone: "zuobian", pinyinTone: "zuǒbian", meaning: "bên trái", detail: "• Cấu tạo: 左 (Tay thợ thủ công 工) + 边 (Lề đường 辶)." }
    ];

    let hsk2List = [];
    let currentIndex = 0;
    let correctCount = 0;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        hsk2List = shuffleArray(originalList);
        currentIndex = 0;
        correctCount = 0;
        loadCard();
    }

    function loadCard() {
        if (currentIndex >= hsk2List.length) {
            alert("🎉 Chúc mừng bạn đã hoàn thành xuất sắc tất cả 153 từ vựng vòng này! Chương trình sẽ xáo trộn lại từ đầu để bạn luyện tập tiếp.");
            initQuiz();
            return;
        }
        const currentWord = hsk2List[currentIndex];
        document.getElementById('hanziCard').innerText = currentWord.hanzi;
        document.getElementById('pinyinInput').value = '';
        
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'none';
        msg.innerHTML = '';
        
        document.getElementById('aiResultMsg').style.display = 'none';
        updateStats();
    }

    function updateStats() {
        document.getElementById('stats').innerText = `Đã học ${currentIndex + 1}/${hsk2List.length} · Đúng ${correctCount}`;
    }

    function checkAnswer() {
        const userVal = document.getElementById('pinyinInput').value.trim().toLowerCase();
        const currentWord = hsk2List[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';

        if (userVal === currentWord.pinyinNoTone) {
            msg.style.color = "#4ec9b0";
            msg.innerHTML = `✅ <b>Chính xác!</b><br>` +
                            `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                            `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                            `• <i>Phân tích & Mẹo nhớ chi tiết:</i><br>${currentWord.detail}`;
            correctCount++;
            updateStats();
        } else {
            msg.style.color = "#f14c4c";
            msg.innerHTML = "❌ Chưa đúng, bạn hãy thử gõ lại Pinyin hoặc bấm Bỏ qua để xem đáp án nhé!";
        }
    }

    function skipAndShowAnswer() {
        const currentWord = hsk2List[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';
        msg.style.color = "#dcdcaa";
        msg.innerHTML = `💡 <b>Đáp án & Phân tích chi tiết:</b><br>` +
                        `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                        `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                        `• <i>Phân tích & Mẹo nhớ chi tiết:</i><br>${currentWord.detail}`;
    }

    function nextCard() {
        currentIndex++;
        loadCard();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    }

    function checkSentenceWithAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const sentence = document.getElementById('userSentence').value.trim();
        const currentWord = hsk2List[currentIndex];
        const aiMsg = document.getElementById('aiResultMsg');
        aiMsg.style.display = 'block';

        if (!apiKey) {
            alert("Vui lòng nhập Gemini API Key!");
            return;
        }
        if (!sentence) {
            alert("Vui lòng viết câu của bạn!");
            return;
        }

        aiMsg.style.color = "#d4d4d4";
        aiMsg.innerText = "🤖 AI đang phân tích câu của bạn...";

        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: `Hãy sửa câu tiếng Trung sau đây giúp tôi: "${sentence}". Từ vựng trọng tâm là "${currentWord.hanzi}". Hãy nhận xét ngữ pháp, sửa lỗi nếu có và dịch sang tiếng Việt bằng văn phong ngắn gọn.` }]
                }]
            })
        })
        .then(response => response.json())
        .then(data => {
            const reply = data.candidates[0].content.parts[0].text;
            aiMsg.style.color = "#4ec9b0";
            aiMsg.innerText = reply;
        })
        .catch(error => {
            aiMsg.style.color = "#f14c4c";
            aiMsg.innerText = "⚠️ Lỗi kết nối AI, vui lòng kiểm tra lại API key.";
        });
    }

    initQuiz();
</script>
