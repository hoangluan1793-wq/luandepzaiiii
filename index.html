        { hanzi: "再", pinyinNoTone: "zai", pinyinTone: "zài", meaning: "lại, nữa" },
        { hanzi: "早上", pinyinNoTone: "zaoshang", pinyinTone: "zǎoshang", meaning: "buổi sáng" },
        { hanzi: "张", pinyinNoTone: "zhang", pinyinTone: "zhāng", meaning: "tấm, trương (lượng từ)" },
        { hanzi: "丈夫", pinyinNoTone: "zhangfu", pinyinTone: "zhàngfu", meaning: "chồng" },
        { hanzi: "找", pinyinNoTone: "zhao", pinyinTone: "zhǎo", meaning: "tìm kiếm" },
        { hanzi: "着", pinyinNoTone: "zhe", pinyinTone: "zhe", meaning: "đang (trợ từ tiếp diễn)" },
        { hanzi: "真", pinyinNoTone: "zhen", pinyinTone: "zhēn", meaning: "thật, thực sự" },
        { hanzi: "正在", pinyinNoTone: "zhengzai", pinyinTone: "zhèngzài", meaning: "đang (làm gì)" },
        { hanzi: "知道", pinyinNoTone: "zhidao", pinyinTone: "zhīdào", meaning: "biết" },
        { hanzi: "准备", pinyinNoTone: "zhunbei", pinyinTone: "zhǔnbèi", meaning: "chuẩn bị" },
        { hanzi: "自行车", pinyinNoTone: "zixingche", pinyinTone: "zìxíngchē", meaning: "xe đạp" },
        { hanzi: "走", pinyinNoTone: "zou", pinyinTone: "zǒu", meaning: "đi" },
        { hanzi: "最", pinyinNoTone: "zui", pinyinTone: "zuì", meaning: "nhất" },
        { hanzi: "左边", pinyinNoTone: "zuobian", pinyinTone: "zuǒbian", meaning: "bên trái" }
    ];

    let hsk2List = [];
    let currentIndex = 0;
    let correctCount = 0;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        hsk2List = shuffleArray(originalList);
        currentIndex = 0;
        correctCount = 0;
        loadCard();
    }

    function loadCard() {
        if (currentIndex >= hsk2List.length) {
            alert("🎉 Chúc mừng bạn đã hoàn thành xuất sắc tất cả 153 từ vựng vòng này! Chương trình sẽ xáo trộn lại từ đầu để bạn luyện tập tiếp.");
            initQuiz();
            return;
        }
        const currentWord = hsk2List[currentIndex];
        document.getElementById('hanziCard').innerText = currentWord.hanzi;
        document.getElementById('pinyinInput').value = '';
        document.getElementById('resultMsg').innerText = '';
        document.getElementById('aiResultMsg').innerText = '';
        updateStats();
    }

    function updateStats() {
        document.getElementById('stats').innerText = `Đã học ${currentIndex + 1}/${hsk2List.length} · Đúng ${correctCount}`;
    }

    function checkAnswer() {
        const userVal = document.getElementById('pinyinInput').value.trim().toLowerCase();
        const currentWord = hsk2List[currentIndex];
        const msg = document.getElementById('resultMsg');

        if (userVal === currentWord.pinyinNoTone) {
            msg.style.color = "green";
            msg.innerText = `Chính xác! (${currentWord.pinyinTone}) - Nghĩa: ${currentWord.meaning}`;
            correctCount++;
            updateStats();
        } else {
            msg.style.color = "red";
            msg.innerText = "Chưa đúng, hãy thử lại!";
        }
    }

    function skipAndShowAnswer() {
        const currentWord = hsk2List[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.color = "#8b4513";
        msg.innerHTML = `Đáp án: <span style="color: #b22222; font-size: 18px;">[${currentWord.pinyinTone}]</span> - Nghĩa: ${currentWord.meaning}`;
    }

    function nextCard() {
        currentIndex++;
        loadCard();
    }

    function checkSentenceWithAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const sentence = document.getElementById('userSentence').value.trim();
        const currentWord = hsk2List[currentIndex];
        const aiMsg = document.getElementById('aiResultMsg');

        if (!apiKey) {
            alert("Vui lòng nhập Gemini API Key!");
            return;
        }
        if (!sentence) {
            alert("Vui lòng viết câu của bạn!");
            return;
        }

        aiMsg.style.color = "#333";
        aiMsg.innerText = "AI đang phân tích câu của bạn...";

        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: `Hãy sửa câu tiếng Trung sau đây giúp tôi: "${sentence}". Từ vựng trọng tâm là "${currentWord.hanzi}". Hãy nhận xét ngữ pháp, sửa lỗi nếu có và dịch sang tiếng Việt bằng văn phong ngắn gọn.` }]
                }]
            })
        })
        .then(response => response.json())
        .then(data => {
            const reply = data.candidates[0].content.parts[0].text;
            aiMsg.style.color = "green";
            aiMsg.innerText = reply;
        })
        .catch(error => {
            aiMsg.style.color = "red";
            aiMsg.innerText = "Lỗi kết nối AI, vui lòng kiểm tra lại API key.";
        });
    }

    initQuiz();
</script>
