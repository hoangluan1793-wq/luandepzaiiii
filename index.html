<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện chữ Hán HSK1 & HSK2 - Chuyên sâu Nhớ Mặt Chữ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            margin: 0;
            padding: 20px;
            color: #d4d4d4;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #fff;
        }
        .stats {
            font-size: 14px;
            color: #aaa;
        }
        .settings-bar {
            background: #2d2d2d;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #444;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-bar label {
            font-weight: bold;
            color: #feb867;
            font-size: 14px;
        }
        .settings-bar select {
            padding: 8px 12px;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        .card-box, .ai-section {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .hanzi-display {
            font-size: 75px;
            text-align: center;
            margin-bottom: 15px;
            color: #ff7b72;
            font-weight: bold;
            letter-spacing: 4px;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #007acc;
            outline: none;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .quiz-btn {
            background-color: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #444;
            padding: 12px 15px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .quiz-btn:hover:not(:disabled) {
            background-color: #383838;
            border-color: #007acc;
            color: #fff;
        }
        .quiz-btn.correct {
            background-color: #1b4332 !important;
            border-color: #2d6a4f !important;
            color: #95d5b2 !important;
        }
        .quiz-btn.incorrect {
            background-color: #581c1c !important;
            border-color: #7f1d1d !important;
            color: #fca5a5 !important;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-check {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-check:hover { background-color: #444; }
        .btn-skip {
            background-color: #3c3836;
            color: #feb867;
            width: 100%;
            margin-top: 5px;
        }
        .btn-skip:hover { background-color: #4c4643; }
        
        .btn-prev {
            background-color: #3b3b3b;
            color: #fff;
            flex: 1;
        }
        .btn-prev:hover:not(:disabled) { background-color: #4b4b4b; }
        .btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-next {
            background-color: #2ea043;
            color: #fff;
            flex: 2;
        }
        .btn-next:hover { background-color: #2c974b; }

        .ai-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #fff;
        }
        .ai-section p {
            font-size: 13px;
            color: #aaa;
        }
        .btn-ai {
            background-color: #8b3a3a;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .result-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            background-color: #1e1e1e;
            border: 1px dashed #555;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>练习 · Luyện chữ Hán Tiếng Trung</h2>
        <div class="stats" id="stats">Đã học 1/150 · Đúng 0</div>
    </div>

    <div class="settings-bar">
        <div>
            <label for="levelSelect">📚 Cấp độ:</label>
            <select id="levelSelect" onchange="changeSettings()">
                <option value="hsk1">HSK 1 (150 từ)</option>
                <option value="hsk2" selected>HSK 2 (153 từ)</option>
            </select>
        </div>
        <div>
            <label for="modeSelect">⚙️ Chế độ:</label>
            <select id="modeSelect" onchange="changeSettings()">
                <option value="quiz" selected>Trắc nghiệm A-B-C-D</option>
                <option value="input">Gõ Pinyin thủ công</option>
            </select>
        </div>
    </div>

    <div class="card-box">
        <div class="hanzi-display" id="hanziCard">字</div>

        <div id="quizContainer" class="quiz-options"></div>

        <div id="inputContainer" style="display: none;">
            <div class="input-group">
                <input type="text" id="pinyinInput" placeholder="Gõ pinyin (không dấu), ấn Enter..." onkeypress="handleKeyPress(event)">
                <button class="btn-check" onclick="checkAnswerInput()">Kiểm tra</button>
            </div>
        </div>

        <button class="btn-skip" onclick="skipAndShowAnswer()">Bỏ qua / Xem đáp án & Mẹo nhớ mặt chữ</button>
        
        <div class="nav-buttons">
            <button class="btn-prev" id="prevBtn" onclick="prevCard()" disabled>⬅️ Câu trước</button>
            <button class="btn-next" onclick="nextCard()">Câu tiếp theo ➔</button>
        </div>

        <div class="result-message" id="resultMsg" style="display: none;"></div>
    </div>

    <div class="ai-section">
        <h3>Đặt câu với từ này</h3>
        <p>Thử viết một câu tiếng Trung dùng từ vừa học, rồi nhờ AI kiểm tra giúp bạn.</p>
        <div class="input-group" style="margin-bottom: 10px;">
            <input type="text" id="apiKeyInput" placeholder="Dán Gemini API key của bạn vào đây (chỉ lưu tạm trên trình duyệt)...">
        </div>
        <div class="input-group">
            <input type="text" id="userSentence" placeholder="Viết câu của bạn bằng chữ Hán ở đây...">
        </div>
        <button class="btn-ai" onclick="checkSentenceWithAI()">Nhờ AI sửa câu</button>
        <div class="result-message" id="aiResultMsg" style="display: none;"></div>
    </div>
</div>

        { hanzi: "羊肉", pinyinNoTone: "yangrou", pinyinTone: "yángròu", meaning: "thịt dê", detail: "• <b>Mặt chữ:</b> 羊 + 肉." },
        { hanzi: "药", pinyinNoTone: "yao", pinyinTone: "yào", meaning: "thuốc", detail: "• <b>Mặt chữ:</b> <b>bộ thảo (艹)</b>." },
        { hanzi: "要", pinyinNoTone: "yao", pinyinTone: "yào", meaning: "muốn", detail: "• <b>Mặt chữ:</b> Nhu cầu." },
        { hanzi: "也", pinyinNoTone: "ye", pinyinTone: "yě", meaning: "cũng", detail: "• <b>Mặt chữ:</b> Tương tự." },
        { hanzi: "阴", pinyinNoTone: "yin", pinyinTone: "yīn", meaning: "âm u", detail: "• <b>Mặt chữ:</b> <b>bộ ấp (阝)</b>." },

        { hanzi: "游泳", pinyinNoTone: "youyong", pinyinTone: "yóuyǒng", meaning: "bơi", detail: "• <b>Mặt chữ:</b> <b>bộ thủy (氵)</b>." },
        { hanzi: "右边", pinyinNoTone: "youbian", pinyinTone: "yòubian", meaning: "phải", detail: "• <b>Mặt chữ:</b> Tay phải + <b>辶</b>." },
        { hanzi: "鱼", pinyinNoTone: "yu", pinyinTone: "yú", meaning: "cá", detail: "• <b>Mặt chữ:</b> Con cá." },
        { hanzi: "元", pinyinNoTone: "yuan", pinyinTone: "yuán", meaning: "tệ", detail: "• <b>Mặt chữ:</b> Tiền tệ." },
        { hanzi: "远", pinyinNoTone: "yuan", pinyinTone: "yuǎn", meaning: "xa", detail: "• <b>Mặt chữ:</b> <b>bộ xước (辶)</b>." },
        { hanzi: "运动", pinyinNoTone: "yundong", pinyinTone: "yùndòng", meaning: "vận động", detail: "• <b>Mặt chữ:</b> 运 (<b>辶</b>) + 动 (<b>力</b>)." },
        { hanzi: "再", pinyinNoTone: "zai", pinyinTone: "zài", meaning: "lại", detail: "• <b>Mặt chữ:</b> Lặp lại." },
        { hanzi: "早上", pinyinNoTone: "zaoshang", pinyinTone: "zǎoshang", meaning: "sáng", detail: "• <b>Mặt chữ:</b> <b>bộ nhật (日)</b>." },
        { hanzi: "张", pinyinNoTone: "zhang", pinyinTone: "zhāng", meaning: "tấm", detail: "• <b>Mặt chữ:</b> <b>bộ cung (弓)</b>." },
        { hanzi: "丈夫", pinyinNoTone: "zhangfu", pinyinTone: "zhàngfu", meaning: "chồng", detail: "• <b>Mặt chữ:</b> Đại + Phu." },
        { hanzi: "找", pinyinNoTone: "zhao", pinyinTone: "zhǎo", meaning: "tìm", detail: "• <b>Mặt chữ:</b> <b>bộ thủ (扌)</b>." },
        { hanzi: "着", pinyinNoTone: "zhe", pinyinTone: "zhe", meaning: "đang", detail: "• <b>Mặt chữ:</b> Trợ từ." },
        { hanzi: "真", pinyinNoTone: "zhen", pinyinTone: "zhēn", meaning: "thật", detail: "• <b>Mặt chữ:</b> <b>bộ mục (目)</b>." },
        { hanzi: "正在", pinyinNoTone: "zhengzai", pinyinTone: "zhèngzài", meaning: "đang", detail: "• <b>Mặt chữ:</b> Chính + Tại." },
        { hanzi: "知道", pinyinNoTone: "zhidao", pinyinTone: "zhīdào", meaning: "biết", detail: "• <b>Mặt chữ:</b> 知 + 辶." },
        { hanzi: "准备", pinyinNoTone: "zhunbei", pinyinTone: "zhǔnbèi", meaning: "chuẩn bị", detail: "• <b>Mặt chữ:</b> Sẵn sàng." },
        { hanzi: "自行车", pinyinNoTone: "zixingche", pinyinTone: "zìxíngchē", meaning: "xe đạp", detail: "• <b>Mặt chữ:</b> 自 + 行 + 车." },
        { hanzi: "走", pinyinNoTone: "zou", pinyinTone: "zǒu", meaning: "đi", detail: "• <b>Mặt chữ:</b> Sải chân đi." },
        { hanzi: "最", pinyinNoTone: "zui", pinyinTone: "zuì", meaning: "nhất", detail: "• <b>Mặt chữ:</b> Vị trí đầu." },
        { hanzi: "左边", pinyinNoTone: "zuobian", pinyinTone: "zuǒbian", meaning: "trái", detail: "• <b>Mặt chữ:</b> Trái + <b>辶</b>." }
    ];

    let currentData = hsk2Data;
    let currentList = [];
    let currentIndex = 0;
    let correctCount = 0;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function changeSettings() {
        const level = document.getElementById('levelSelect').value;
        const mode = document.getElementById('modeSelect').value;

        if (level === 'hsk1') {
            currentData = hsk1Data;
        } else {
            currentData = hsk2Data;
        }

        if (mode === 'quiz') {
            document.getElementById('quizContainer').style.display = 'flex';
            document.getElementById('inputContainer').style.display = 'none';
        } else {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('inputContainer').style.display = 'block';
        }

        initQuiz();
    }

    function initQuiz() {
        currentList = shuffleArray(currentData);
        currentIndex = 0;
        correctCount = 0;
        loadCard();
    }

    function loadCard() {
        if (currentIndex >= currentList.length) {
            alert(`🎉 Chúc mừng bạn đã hoàn thành xuất sắc tất cả ${currentList.length} từ vựng! Chương trình sẽ tự động xáo trộn lại để bạn ôn tập tiếp.`);
            initQuiz();
            return;
        }

        document.getElementById('prevBtn').disabled = (currentIndex === 0);

        const currentWord = currentList[currentIndex];
        document.getElementById('hanziCard').innerText = currentWord.hanzi;
        document.getElementById('pinyinInput').value = '';
        
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'none';
        msg.innerHTML = '';
        
        document.getElementById('aiResultMsg').style.display = 'none';
        updateStats();

        const mode = document.getElementById('modeSelect').value;
        if (mode === 'quiz') {
            setupQuizOptions(currentWord);
        }
    }

    function setupQuizOptions(correctWord) {
        const quizContainer = document.getElementById('quizContainer');
        quizContainer.innerHTML = '';

        const correctLength = correctWord.hanzi.length;
        let sameLengthOptions = currentData.filter(item => item.hanzi !== correctWord.hanzi && item.hanzi.length === correctLength);

        if (sameLengthOptions.length < 3) {
            let fallbackOptions = currentData.filter(item => item.hanzi !== correctWord.hanzi);
            sameLengthOptions = [...sameLengthOptions, ...fallbackOptions];
        }

        let wrongOptions = shuffleArray(sameLengthOptions).slice(0, 3);
        let options = [...wrongOptions, correctWord];
        options = shuffleArray(options);

        const labels = ['A', 'B', 'C', 'D'];
        options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerHTML = `<b>${labels[index]}.</b> [${opt.pinyinTone}] — ${opt.meaning}`;
            btn.onclick = () => checkAnswerQuiz(opt.hanzi === correctWord.hanzi, btn, correctWord);
            quizContainer.appendChild(btn);
        });
    }

    function checkAnswerQuiz(isCorrect, clickedBtn, correctWord) {
        const quizContainer = document.getElementById('quizContainer');
        const buttons = quizContainer.getElementsByTagName('button');

        for (let btn of buttons) {
            btn.disabled = true;
            if (btn.innerHTML.includes(correctWord.pinyinTone)) {
                btn.classList.add('correct');
            }
        }

        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';

        if (isCorrect) {
            clickedBtn.classList.add('correct');
            msg.style.color = "#4ec9b0";
            msg.innerHTML = `✅ <b>Chính xác tuyệt vời!</b><br>` +
                            `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${correctWord.pinyinTone}]</span><br>` +
                            `• Nghĩa tiếng Việt: <b>${correctWord.meaning}</b><br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${correctWord.detail}`;
            correctCount++;
            updateStats();
        } else {
            clickedBtn.classList.add('incorrect');
            msg.style.color = "#f14c4c";
            msg.innerHTML = `❌ <b>Chưa chính xác!</b> Đáp án đúng là: [${correctWord.pinyinTone}] — ${correctWord.meaning}<br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${correctWord.detail}`;
        }
    }

    function updateStats() {
        document.getElementById('stats').innerText = `Đã học ${currentIndex + 1}/${currentList.length} · Đúng ${correctCount}`;
    }

    function checkAnswerInput() {
        const userVal = document.getElementById('pinyinInput').value.trim().toLowerCase();
        const currentWord = currentList[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';

        if (userVal === currentWord.pinyinNoTone) {
            msg.style.color = "#4ec9b0";
            msg.innerHTML = `✅ <b>Chính xác!</b><br>` +
                            `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                            `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${currentWord.detail}`;
            correctCount++;
            updateStats();
        } else {
            msg.style.color = "#f14c4c";
            msg.innerHTML = "❌ Chưa đúng, bạn hãy thử gõ lại Pinyin hoặc bấm Bỏ qua để xem đáp án nhé!";
        }
    }

    function skipAndShowAnswer() {
        const currentWord = currentList[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';
        msg.style.color = "#dcdcaa";
        msg.innerHTML = `💡 <b>Đáp án & Nhận diện mặt chữ:</b><br>` +
                        `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                        `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                        `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${currentWord.detail}`;

        const mode = document.getElementById('modeSelect').value;
        if (mode === 'quiz') {
            const quizContainer = document.getElementById('quizContainer');
            const buttons = quizContainer.getElementsByTagName('button');
            for (let btn of buttons) {
                btn.disabled = true;
                if (btn.innerHTML.includes(currentWord.pinyinTone)) {
                    btn.classList.add('correct');
                }
            }
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            loadCard();
        }
    }

    function nextCard() {
        currentIndex++;
        loadCard();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            checkAnswerInput();
        }
    }

    function checkSentenceWithAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const sentence = document.getElementById('userSentence').value.trim();
        const currentWord = currentList[currentIndex];
        const aiMsg = document.getElementById('aiResultMsg');
        aiMsg.style.display = 'block';

        if (!apiKey) {
            alert("Vui lòng nhập Gemini API Key!");
            return;
        }
        if (!sentence) {
            alert("Vui lòng viết câu của bạn!");
            return;
        }

        aiMsg.style.color = "#d4d4d4";
        aiMsg.innerText = "🤖 AI đang phân tích câu của bạn...";

        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: `Hãy sửa câu tiếng Trung sau đây giúp tôi: "${sentence}". Từ vựng trọng tâm là "${currentWord.hanzi}". Hãy nhận xét ngữ pháp, sửa lỗi nếu có và dịch sang tiếng Việt bằng văn phong ngắn gọn.` }]
                }]
            })
        })
        .then(response => response.json())
        .then(data => {
            const reply = data.candidates[0].content.parts[0].text;
            aiMsg.style.color = "#4ec9b0";
            aiMsg.innerText = reply;
        })
        .catch(error => {
            aiMsg.style.color = "#f14c4c";
            aiMsg.innerText = "⚠️ Lỗi kết nối AI, vui lòng kiểm tra lại API key.";
        });
    }

    changeSettings();
</script>
