<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện chữ Hán HSK1 & HSK2 - Chuyên sâu Nhớ Mặt Chữ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            margin: 0;
            padding: 20px;
            color: #d4d4d4;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #fff;
        }
        .stats {
            font-size: 14px;
            color: #aaa;
        }
        .settings-bar {
            background: #2d2d2d;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #444;
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-bar label {
            font-weight: bold;
            color: #feb867;
            font-size: 14px;
        }
        .settings-bar select {
            padding: 8px 12px;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        .card-box, .ai-section {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .hanzi-display {
            font-size: 75px;
            text-align: center;
            margin-bottom: 15px;
            color: #ff7b72;
            font-weight: bold;
            letter-spacing: 4px;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #007acc;
            outline: none;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .quiz-btn {
            background-color: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #444;
            padding: 12px 15px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .quiz-btn.hover:not(:disabled) {
            background-color: #383838;
            border-color: #007acc;
            color: #fff;
        }
        .quiz-btn.correct {
            background-color: #1b4332 !important;
            border-color: #2d6a4f !important;
            color: #95d5b2 !important;
        }
        .quiz-btn.incorrect {
            background-color: #581c1c !important;
            border-color: #7f1d1d !important;
            color: #fca5a5 !important;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-check {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-check:hover { background-color: #444; }
        .btn-skip {
            background-color: #3c3836;
            color: #feb867;
            width: 100%;
            margin-top: 5px;
        }
        .btn-skip:hover { background-color: #4c4643; }
        
        .btn-prev {
            background-color: #3b3b3b;
            color: #fff;
            flex: 1;
        }
        .btn-prev:hover:not(:disabled) { background-color: #4b4b4b; }
        .btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-next {
            background-color: #2ea043;
            color: #fff;
            flex: 2;
        }
        .btn-next:hover { background-color: #2c974b; }

        .ai-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #fff;
        }
        .ai-section p {
            font-size: 13px;
            color: #aaa;
        }
        .btn-ai {
            background-color: #8b3a3a;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .result-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            background-color: #1e1e1e;
            border: 1px dashed #555;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>练习 · Luyện chữ Hán Tiếng Trung</h2>
        <div class="stats" id="stats">Đã học 1/150 · Đúng 0</div>
    </div>

    <div class="settings-bar">
        <div>
            <label for="levelSelect">📚 Cấp độ:</label>
            <select id="levelSelect" onchange="changeSettings()">
                <option value="hsk1">HSK 1 (150 từ)</option>
                <option value="hsk2" selected>HSK 2 (153 từ)</option>
                <option value="hardWords" style="color: #ff7b72; font-weight: bold;">⭐ Ôn tập từ khó (Đã lưu)</option>
            </select>
        </div>
        <div>
            <label for="modeSelect">⚙️ Chế độ:</label>
            <select id="modeSelect" onchange="changeSettings()">
                <option value="modeQuiz" selected>Trắc nghiệm A-B-C-D</option>
                <option value="modeInput">Gõ Pinyin thủ công</option>
            </select>
        </div>
    </div>

    <div class="card-box">
        <div class="hanzi-display" id="hanziCard">字</div>

        <div id="quizContainer" class="quiz-options"></div>

        <div id="inputContainer" style="display: none;">
            <div class="input-group">
                <input type="text" id="pinyinInput" placeholder="Gõ pinyin (không dấu), ấn Enter..." onkeypress="handleKeyPress(event)">
                <button class="btn-check" onclick="checkAnswerInput()">Kiểm tra</button>
            </div>
        </div>

        <button class="btn-skip" onclick="skipAndShowAnswer()">Bỏ qua / Xem đáp án & Mẹo nhớ mặt chữ</button>
        
        <div class="nav-buttons">
            <button class="btn-prev" id="prevBtn" onclick="prevCard()" disabled>⬅️ Câu trước</button>
            <button class="btn-next" onclick="nextCard()">Câu tiếp theo ➔</button>
        </div>

        <div class="result-message" id="resultMsg" style="display: none;"></div>
    </div>

    <div class="ai-section">
        <h3>Đặt câu với từ này</h3>
        <p>Thử viết một câu tiếng Trung dùng từ vừa học, rồi nhờ AI kiểm tra giúp bạn.</p>
        <div class="input-group" style="margin-bottom: 10px;">
            <input type="text" id="apiKeyInput" placeholder="Dán Gemini API key của bạn vào đây (chỉ lưu tạm trên trình duyệt)...">
        </div>
        <div class="input-group">
            <input type="text" id="userSentence" placeholder="Viết câu của bạn bằng chữ Hán ở đây...">
        </div>
        <button class="btn-ai" onclick="checkSentenceWithAI()">Nhờ AI sửa câu</button>
        <div class="result-message" id="aiResultMsg" style="display: none;"></div>
    </div>
</div>

<script>
    const hsk1Data = [
        { hanzi: "爱", pinyinNoTone: "ai", pinyinTone: "ài", meaning: "yêu, thích", detail: "• <b>Phân tích nét/bộ thủ:</b> Gồm chữ trùm ở trên kết hợp với <b>bộ tâm (心 - trái tim)</b> ở dưới.<br>• <b>Mẹo nhớ mặt chữ:</b> Yêu thương là dùng cả <i>trái tim (心)</i> để bao bọc, che chở." },
        { hanzi: "八", pinyinNoTone: "ba", pinyinTone: "bā", meaning: "số 8", detail: "• <b>Phân tích nét/bộ thủ:</b> Gồm hai nét phẩy và mác chụm đầu tách đuôi.<br>• <b>Mẹo nhớ mặt chữ:</b> Giống hình chiếc quạt giấy xòe rộng hoặc hai chân bước ra hai bên." },
        { hanzi: "爸爸", pinyinNoTone: "baba", pinyinTone: "bàba", meaning: "bố, ba", detail: "• <b>Phân tích nét/bộ thủ:</b> Chữ phụ (父 - chỉ người cha) ở trên kết hợp chữ ba (巴) ở dưới để lấy âm đọc.<br>• <b>Mẹo nhớ mặt chữ:</b> Thấy ngay bộ phụ (父) là biểu tượng của người sinh thành ra mình." },
        { hanzi: "杯子", pinyinNoTone: "beizi", pinyinTone: "bēizi", meaning: "cái cốc, cái ly", detail: "• <b>Phân tích nét/bộ thủ:</b> Chữ 杯 gồm <b>bộ mộc (木 - gỗ)</b> bên trái và chữ bất (不) bên phải; kết hợp chữ tử (子) ở sau.<br>• <b>Mẹo nhớ mặt chữ:</b> Cái cốc ngày xưa được tiện bằng <i>gỗ (木)</i> có hình dáng nhỏ xinh." },
        { hanzi: "北京", pinyinNoTone: "beijing", pinyinTone: "Běijīng", meaning: "Bắc Kinh", detail: "• <b>Phân tích nét/bộ thủ:</b> Chữ 北 (hai người quay lưng vào nhau chỉ phương Bắc) + Chữ 京 (tòa thành lớn).<br>• <b>Mẹo nhớ mặt chữ:</b> Kinh đô lớn nằm ở phía phương Bắc." },
        { hanzi: "本", pinyinNoTone: "ben", pinyinTone: "běn", meaning: "cuốn, quyển", detail: "• <b>Phân tích nét/bộ thủ:</b> Chữ mộc (木 - cái cây) có thêm một nét gạch ngang ở phần gốc rễ.<br>• <b>Mẹo nhớ mặt chữ:</b> Gốc rễ của cây (木) chính là cội nguồn làm ra giấy để đóng thành <i>quyển sách (本)</i>." },
        { hanzi: "不客气", pinyinNoTone: "bukeqi", pinyinTone: "bú kèqi", meaning: "không có gì", detail: "• <b>Phân tích nét/bộ thủ:</b> Ghép bởi chữ 不 (không) + 客 (khách) + 气 (hơi thở/khí chất).<br>• <b>Mẹo nhớ mặt chữ:</b> Không cần phải khách sáo giữ ý." },
        { hanzi: "不", pinyinNoTone: "bu", pinyinTone: "bù", meaning: "không", detail: "• <b>Phân tích nét/bộ thủ:</b> Gồm nét ngang, nét sổ và nét mác.<br>• <b>Mẹo nhớ mặt chữ:</b> Hình tượng cái cây bị chặt đứt hoặc nét gạch chéo thể hiện sự từ chối." },
        { hanzi: "菜", pinyinNoTone: "cai", pinyinTone: "cài", meaning: "rau, món ăn", detail: "• <b>Phân tích nét/bộ thủ:</b> Phía trên là <b>bộ thảo (艹 - cỏ cây)</b>, phía dưới là chữ thái.<br>• <b>Mẹo nhớ mặt chữ:</b> Các loại rau củ đều mọc từ <i>cỏ cây, thực vật (艹)</i> lên." },
        { hanzi: "茶", pinyinNoTone: "cha", pinyinTone: "chá", meaning: "trà", detail: "• <b>Phân tích nét/bộ thủ:</b> Trên cùng là <b>bộ thảo (艹 - cỏ cây)</b>, bên dưới là bộ mộc (木) và nhân.<br>• <b>Mẹo nhớ mặt chữ:</b> Lá trà hái từ trên cây <i>thảo mộc (艹)</i> mang đi pha nước." },
        { hanzi: "吃", pinyinNoTone: "chi", pinyinTone: "chī", meaning: "ăn", detail: "• <b>Phân tích nét/bộ thủ:</b> Bên trái là <b>bộ khẩu (口 - cái miệng)</b>, bên phải là chữ khí.<br>• <b>Mẹo nhớ mặt chữ:</b> Hành động ăn uống bắt buộc phải dùng đến cái <i>miệng (口)</i>." },

        { hanzi: "点", pinyinNoTone: "dian", pinyinTone: "diǎn", meaning: "giờ, điểm", detail: "• <b>Phân tích nét/bộ thủ:</b> Phía dưới đáy có <b>4 dấu chấm (灬 - biến thể của bộ hỏa / lửa)</b>.<br>• <b>Mẹo nhớ mặt chữ:</b> Thắp ngọn lửa nhỏ (灬) để định vị chấm điểm thời gian." },
        { hanzi: "电脑", pinyinNoTone: "diannao", pinyinTone: "diànnǎo", meaning: "máy tính", detail: "• <b>Phân tích nét/bộ thủ:</b> 电 (tia chớp điện) + 脑 (có <b>bộ nguyệt 月</b> chỉ bộ phận cơ thể/não bộ).<br>• <b>Mẹo nhớ mặt chữ:</b> Cái hộp chạy bằng điện có bộ não thông minh xử lý dữ liệu." },
        { hanzi: "电视", pinyinNoTone: "dianshi", pinyinTone: "diànshì", meaning: "tivi", detail: "• <b>Phân tích nét/bộ thủ:</b> 电 (điện) + 视 (bên phải có <b>bộ kiến 见 - nhìn ngắm</b>).<br>• <b>Mẹo nhớ mặt chữ:</b> Chiếc màn hình dùng điện để mắt chúng ta nhìn vào thưởng thức." },

        { hanzi: "走", pinyinNoTone: "zou", pinyinTone: "zǒu", meaning: "đi", detail: "• <b>Phân tích nét/bộ thủ:</b> Tượng hình người sải chân bước đi." },
        { hanzi: "最", pinyinNoTone: "zui", pinyinTone: "zuì", meaning: "nhất", detail: "• <b>Phân tích nét/bộ thủ:</b> Đứng đầu vị trí hàng đầu." },
        { hanzi: "左边", pinyinNoTone: "zuobian", pinyinTone: "zuǒbian", meaning: "trái", detail: "• <b>Phân tích nét/bộ thủ:</b> Trái + Lề đường 辶." }

    let currentData = hsk2Data;
    let currentList = [];
    let currentIndex = 0;
    let correctCount = 0;

    function getHardWords() {
        let stored = localStorage.getItem('hsk_hard_words');
        return stored ? JSON.parse(stored) : [];
    }

    function addHardWord(word) {
        let hardWords = getHardWords();
        if (!hardWords.some(item => item.hanzi === word.hanzi)) {
            hardWords.push(word);
            localStorage.setItem('hsk_hard_words', JSON.stringify(hardWords));
        }
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function changeSettings() {
        const level = document.getElementById('levelSelect').value;
        const mode = document.getElementById('modeSelect').value;

        if (level === 'hsk1') {
            currentData = hsk1Data;
        } else if (level === 'hsk2') {
            currentData = hsk2Data;
        } else if (level === 'hardWords') {
            currentData = getHardWords();
            if (currentData.length === 0) {
                alert("Danh sách từ khó đang trống! Hãy làm bài và trả lời sai, các từ đó sẽ tự động được lưu vào đây.");
            }
        }

        if (mode === 'modeQuiz') {
            document.getElementById('quizContainer').style.display = 'flex';
            document.getElementById('inputContainer').style.display = 'none';
        } else {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('inputContainer').style.display = 'block';
        }

        initQuiz();
    }

    function initQuiz() {
        currentList = shuffleArray(currentData);
        currentIndex = 0;
        correctCount = 0;
        loadCard();
    }

    function loadCard() {
        if (currentList.length === 0) {
            document.getElementById('hanziCard').innerText = "Ø";
            document.getElementById('quizContainer').innerHTML = "<p style='text-align:center; color:#aaa;'>Chưa có từ nào trong danh sách này.</p>";
            document.getElementById('stats').innerText = "Danh sách trống";
            return;
        }

        if (currentIndex >= currentList.length) {
            alert(`🎉 Chúc mừng bạn đã ôn hết vòng này! Chương trình sẽ xáo trộn lại để bạn tiếp tục ôn luyện.`);
            initQuiz();
            return;
        }

        document.getElementById('prevBtn').disabled = (currentIndex === 0);

        const currentWord = currentList[currentIndex];
        document.getElementById('hanziCard').innerText = currentWord.hanzi;
        document.getElementById('pinyinInput').value = '';
        
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'none';
        msg.innerHTML = '';
        
        document.getElementById('aiResultMsg').style.display = 'none';
        updateStats();

        const mode = document.getElementById('modeSelect').value;
        if (mode === 'modeQuiz') {
            setupQuizOptions(currentWord);
        }
    }

    function setupQuizOptions(correctWord) {
        const quizContainer = document.getElementById('quizContainer');
        quizContainer.innerHTML = '';

        const allPool = [...hsk1Data, ...hsk2Data];
        const correctLength = correctWord.hanzi.length;
        let sameLengthOptions = allPool.filter(item => item.hanzi !== correctWord.hanzi && item.hanzi.length === correctLength);

        if (sameLengthOptions.length < 3) {
            let fallbackOptions = allPool.filter(item => item.hanzi !== correctWord.hanzi);
            sameLengthOptions = [...sameLengthOptions, ...fallbackOptions];
        }

        let wrongOptions = shuffleArray(sameLengthOptions).slice(0, 3);
        let options = [...wrongOptions, correctWord];
        options = shuffleArray(options);

        const labels = ['A', 'B', 'C', 'D'];
        options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerHTML = `<b>${labels[index]}.</b> [${opt.pinyinTone}] — ${opt.meaning}`;
            btn.onclick = () => checkAnswerQuiz(opt.hanzi === correctWord.hanzi, btn, correctWord);
            quizContainer.appendChild(btn);
        });
    }

    function checkAnswerQuiz(isCorrect, clickedBtn, correctWord) {
        const quizContainer = document.getElementById('quizContainer');
        const buttons = quizContainer.getElementsByTagName('button');

        for (let btn of buttons) {
            btn.disabled = true;
            if (btn.innerHTML.includes(correctWord.pinyinTone)) {
                btn.classList.add('correct');
            }
        }

        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';

        if (isCorrect) {
            clickedBtn.classList.add('correct');
            msg.style.color = "#4ec9b0";
            msg.innerHTML = `✅ <b>Chính xác tuyệt vời!</b><br>` +
                            `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${correctWord.pinyinTone}]</span><br>` +
                            `• Nghĩa tiếng Việt: <b>${correctWord.meaning}</b><br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${correctWord.detail}`;
            correctCount++;
            updateStats();
        } else {
            clickedBtn.classList.add('incorrect');
            msg.style.color = "#f14c4c";
            msg.innerHTML = `❌ <b>Chưa chính xác!</b> Từ này đã được thêm vào <b>⭐ Ôn tập từ khó</b>.<br>` +
                            `• Đáp án đúng: [${correctWord.pinyinTone}] — ${correctWord.meaning}<br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${correctWord.detail}`;
            addHardWord(correctWord);
        }
    }

    function updateStats() {
        document.getElementById('stats').innerText = `Đã học ${currentIndex + 1}/${currentList.length} · Đúng ${correctCount}`;
    }

    function checkAnswerInput() {
        const userVal = document.getElementById('pinyinInput').value.trim().toLowerCase();
        const currentWord = currentList[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';

        if (userVal === currentWord.pinyinNoTone) {
            msg.style.color = "#4ec9b0";
            msg.innerHTML = `✅ <b>Chính xác!</b><br>` +
                            `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                            `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${currentWord.detail}`;
            correctCount++;
            updateStats();
        } else {
            msg.style.color = "#f14c4c";
            msg.innerHTML = `❌ <b>Chưa đúng!</b> Từ này đã được lưu vào <b>⭐ Ôn tập từ khó</b>.<br>` +
                            `• Đáp án đúng: [${currentWord.pinyinTone}] — ${currentWord.meaning}<br>` +
                            `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${currentWord.detail}`;
            addHardWord(currentWord);
        }
    }

    function skipAndShowAnswer() {
        const currentWord = currentList[currentIndex];
        if (!currentWord) return;
        
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';
        msg.style.color = "#dcdcaa";
        msg.innerHTML = `💡 <b>Đáp án & Nhận diện mặt chữ:</b><br>` +
                        `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                        `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                        `• <i>Nhận diện mặt chữ & Mẹo nhớ:</i><br>${currentWord.detail}`;

        addHardWord(currentWord);

        const mode = document.getElementById('modeSelect').value;
        if (mode === 'modeQuiz') {
            const quizContainer = document.getElementById('quizContainer');
            const buttons = quizContainer.getElementsByTagName('button');
            for (let btn of buttons) {
                btn.disabled = true;
                if (btn.innerHTML.includes(currentWord.pinyinTone)) {
                    btn.classList.add('correct');
                }
            }
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            loadCard();
        }
    }

    function nextCard() {
        currentIndex++;
        loadCard();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            checkAnswerInput();
        }
    }

    function checkSentenceWithAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const sentence = document.getElementById('userSentence').value.trim();
        const currentWord = currentList[currentIndex];
        const aiMsg = document.getElementById('aiResultMsg');
        aiMsg.style.display = 'block';

        if (!apiKey) {
            alert("Vui lòng nhập Gemini API Key!");
            return;
        }
        if (!sentence) {
            alert("Vui lòng viết câu của bạn!");
            return;
        }
        if (!currentWord) {
            alert("Chưa có từ vựng hiện tại!");
            return;
        }

        aiMsg.style.color = "#dcdcaa";
        aiMsg.innerText = "🤖 AI đang phân tích câu của bạn...";

        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: `Hãy sửa câu tiếng Trung sau đây giúp tôi: "${sentence}". Từ vựng trọng tâm là "${currentWord.hanzi}". Hãy nhận xét ngữ pháp, sửa lỗi nếu có và dịch sang tiếng Việt bằng văn phong ngắn gọn.` }]
                }]
            })
        })
        .then(response => response.json())
        .then(data => {
            const reply = data.candidates[0].content.parts[0].text;
            aiMsg.style.color = "#4ec9b0";
            aiMsg.innerText = reply;
        })
        .catch(error => {
            aiMsg.style.color = "#f14c4c";
            aiMsg.innerText = "⚠️️ Lỗi kết nối AI, vui lòng kiểm tra lại API key.";
        });
    }

    changeSettings();
</script>
