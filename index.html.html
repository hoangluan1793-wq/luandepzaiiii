<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện chữ Hán HSK2 - 153 Từ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            margin: 0;
            padding: 20px;
            color: #d4d4d4;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #fff;
        }
        .stats {
            font-size: 14px;
            color: #aaa;
        }
        .card-box, .ai-section {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .hanzi-display {
            font-size: 55px;
            text-align: center;
            margin-bottom: 15px;
            color: #ff7b72;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #007acc;
            outline: none;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-check {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-check:hover { background-color: #444; }
        .btn-skip {
            background-color: #3c3836;
            color: #feb867;
            width: 100%;
            margin-top: 5px;
        }
        .btn-skip:hover { background-color: #4c4643; }
        .btn-next {
            background-color: #2ea043;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .btn-next:hover { background-color: #2c974b; }
        .ai-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: #fff;
        }
        .ai-section p {
            font-size: 13px;
            color: #aaa;
        }
        .btn-ai {
            background-color: #8b3a3a;
            color: #fff;
            width: 100%;
            margin-top: 10px;
        }
        .result-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.5;
            background-color: #1e1e1e;
            border: 1px dashed #444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>练习 · Luyện chữ Hán HSK2</h2>
        <div class="stats" id="stats">Đã học 1/153 · Đúng 0</div>
    </div>

    <!-- Thẻ học chữ Hán -->
    <div class="card-box">
        <div class="hanzi-display" id="hanziCard">字</div>
        <div class="input-group">
            <input type="text" id="pinyinInput" placeholder="Gõ pinyin của chữ này (không cần dấu thanh)..." onkeypress="handleKeyPress(event)">
            <button class="btn-check" onclick="checkAnswer()">Kiểm tra</button>
        </div>
        <button class="btn-skip" onclick="skipAndShowAnswer()">Bỏ qua / Xem đáp án & Bộ thủ</button>
        <button class="btn-next" onclick="nextCard()">Chuyển từ tiếp theo ➔</button>
        <div class="result-message" id="resultMsg" style="display: none;"></div>
    </div>

    <!-- Phần đặt câu với AI -->
    <div class="ai-section">
        <h3>Đặt câu với từ này</h3>
        <p>Thử viết một câu tiếng Trung dùng từ vừa học, rồi nhờ AI kiểm tra giúp bạn.</p>
        <div class="input-group" style="margin-bottom: 10px;">
            <input type="text" id="apiKeyInput" placeholder="Dán Gemini API key của bạn vào đây (chỉ lưu tạm trên trình duyệt)...">
        </div>
        <div class="input-group">
            <input type="text" id="userSentence" placeholder="Viết câu của bạn bằng chữ Hán ở đây...">
        </div>
        <button class="btn-ai" onclick="checkSentenceWithAI()">Nhờ AI sửa câu</button>
        <div class="result-message" id="aiResultMsg" style="display: none;"></div>
    </div>
</div>

        const currentWord = hsk2List[currentIndex];
        document.getElementById('hanziCard').innerText = currentWord.hanzi;
        document.getElementById('pinyinInput').value = '';
        
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'none';
        msg.innerHTML = '';
        
        document.getElementById('aiResultMsg').style.display = 'none';
        updateStats();
    }

    function updateStats() {
        document.getElementById('stats').innerText = `Đã học ${currentIndex + 1}/${hsk2List.length} · Đúng ${correctCount}`;
    }

    function checkAnswer() {
        const userVal = document.getElementById('pinyinInput').value.trim().toLowerCase();
        const currentWord = hsk2List[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';

        if (userVal === currentWord.pinyinNoTone) {
            msg.style.color = "#4ec9b0";
            msg.innerHTML = `✅ <b>Chính xác!</b><br>` +
                            `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                            `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                            `• <i>Giải thích bộ thủ & cấu tạo:</i> ${currentWord.radical}`;
            correctCount++;
            updateStats();
        } else {
            msg.style.color = "#f14c4c";
            msg.innerHTML = "❌ Chưa đúng, bạn hãy thử gõ lại Pinyin hoặc bấm Bỏ qua để xem đáp án nhé!";
        }
    }

    function skipAndShowAnswer() {
        const currentWord = hsk2List[currentIndex];
        const msg = document.getElementById('resultMsg');
        msg.style.display = 'block';
        msg.style.color = "#dcdcaa";
        msg.innerHTML = `💡 <b>Đáp án chi tiết:</b><br>` +
                        `• Pinyin: <span style="color: #ff7b72; font-size: 18px;">[${currentWord.pinyinTone}]</span><br>` +
                        `• Nghĩa tiếng Việt: <b>${currentWord.meaning}</b><br>` +
                        `• <i>Giải thích bộ thủ & cấu tạo:</i> ${currentWord.radical}`;
    }

    function nextCard() {
        currentIndex++;
        loadCard();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    }

    function checkSentenceWithAI() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const sentence = document.getElementById('userSentence').value.trim();
        const currentWord = hsk2List[currentIndex];
        const aiMsg = document.getElementById('aiResultMsg');
        aiMsg.style.display = 'block';

        if (!apiKey) {
            alert("Vui lòng nhập Gemini API Key!");
            return;
        }
        if (!sentence) {
            alert("Vui lòng viết câu của bạn!");
            return;
        }

        aiMsg.style.color = "#d4d4d4";
        aiMsg.innerText = "🤖 AI đang phân tích câu của bạn...";

        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: `Hãy sửa câu tiếng Trung sau đây giúp tôi: "${sentence}". Từ vựng trọng tâm là "${currentWord.hanzi}". Hãy nhận xét ngữ pháp, sửa lỗi nếu có và dịch sang tiếng Việt bằng văn phong ngắn gọn.` }]
                }]
            })
        })
        .then(response => response.json())
        .then(data => {
            const reply = data.candidates[0].content.parts[0].text;
            aiMsg.style.color = "#4ec9b0";
            aiMsg.innerText = reply;
        })
        .catch(error => {
            aiMsg.style.color = "#f14c4c";
            aiMsg.innerText = "⚠️ Lỗi kết nối AI, vui lòng kiểm tra lại API key.";
        });
    }

    initQuiz();
</script>

</body>
</html>
